overwrite: true
schema: "./src/schema.graphql"
documents: "./src/**/*.graphql"
generates:
  src/generated/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-resolvers"
    config:
      skipTypename: false
      withHooks: false
      withHOC: false
      withComponent: false
